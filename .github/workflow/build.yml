
name: Build KMP App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- THIS IS THE NEW STEP ---
      # Create the local.properties file from GitHub secrets before the build
      - name: Create local.properties
        run: |
          echo "apiKey=${{ secrets.API_KEY }}" >> local.properties
          echo "model=${{ secrets.MODEL_NAME }}" >> local.properties
          echo "liveModel=${{ secrets.LIVE_MODEL_NAME }}" >> local.properties
          echo "webClientId=${{ secrets.WEB_CLIENT_ID }}" >> local.properties


        # ---------------------------
        # The 'env' block is not strictly necessary here but shows how secrets are accessed
        env:
          API_KEY: ${{ secrets.API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
      # ---------------------------

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App (Debug)
        run: ./gradlew :composeApp:assembleDebug

      - name: Build iOS App (for Simulator)
        run: ./gradlew :composeApp:iosX64Binaries
