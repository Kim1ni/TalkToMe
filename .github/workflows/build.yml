
  # A simple name for your workflow
  name: Build KMP App

  # Controls when the workflow will run.
  # This workflow runs on any push to the 'main' branch.
  on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

  # A workflow run is made up of one or more jobs that can run sequentially or in parallel
  jobs:
    # This job is named 'build'
    build:
      # The type of runner that the job will run on.
      # We must use a macOS runner because building an iOS app requires Xcode.
      runs-on: macos-latest

      # Steps represent a sequence of tasks that will be executed as part of the job
      steps:
        # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        - name: Checkout repository
          uses: actions/checkout@v4

        # 2. Sets up the Java Development Kit (JDK) needed for Gradle
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        # 3. Caches Gradle dependencies and wrappers to speed up subsequent builds
        - name: Cache Gradle dependencies
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        # 4. Grants execute permissions to the Gradle wrapper script
        # This is a crucial step, especially on Unix-based systems like macOS and Linux.
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 5. Build the Android debug APK
        # This step compiles the Android app and runs any associated unit tests.
        - name: Build Android App (Debug)
          run: ./gradlew :composeApp:assembleDebug

        # 6. Build the iOS app for the simulator
        # This step compiles the shared KMP framework and the iOS application itself,
        # ensuring that your iOS-specific code and dependencies are correct.
        # We use xcodebuild to build for a simulator to avoid code-signing issues.
        - name: Build iOS App (for Simulator)
          run: ./gradlew :composeApp:iosX64Binaries

        # === OPTIONAL: Upload APK as an artifact ===
        # Uncomment the following lines if you want to be able to download the APK
        # directly from the GitHub Actions run summary page.
        # - name: Upload Android APK
